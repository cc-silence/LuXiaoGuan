name: CI
'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sources:
    name: source-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/ci_repository_check.py
      - run: python -m compileall -q main.py router_app modules scripts tests

  windows:
    name: windows-offline-checks
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - name: Verify Lua 5.1 is installed
        run: python -c "from lupa.lua51 import LuaRuntime; assert LuaRuntime().eval('_VERSION') == 'Lua 5.1'"
      - name: Run all offline test modules
        run: python scripts/run_compatibility_audit.py --output build/ci --timeout 120 --workers 1
      - name: Validate complete audit and expected skips
        run: python scripts/ci_repository_check.py --audit-summary build/ci/summary.json
      - name: Save bounded test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-offline-results
          path: |
            build/ci/summary.json
            build/ci/*.log
          if-no-files-found: ignore
          retention-days: 3

  gate:
    name: collaboration-gate
    if: always()
    needs: [sources, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SOURCE_RESULT: ${{ needs.sources.result }}
      WINDOWS_RESULT: ${{ needs.windows.result }}
    steps:
      - name: Require both checks to pass
        run: |
          python3 - <<'PY'
          import os
          import sys
          results = {name: os.environ[name] for name in ("SOURCE_RESULT", "WINDOWS_RESULT")}
          print(results)
          sys.exit(0 if all(value == "success" for value in results.values()) else 1)
          PY
